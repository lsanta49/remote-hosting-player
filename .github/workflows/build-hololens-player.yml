name: Build HoloLens SamplePlayer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: player        # ← aponta para a pasta player
        run: nuget restore SamplePlayer.sln

      - name: Build ARM64 Release
        working-directory: player        # ← aponta para a pasta player
        run: |
          msbuild SamplePlayer.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=ARM64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: SamplePlayer-ARM64-Release
          path: |
            player/AppPackages/**/*.msixbundle
            player/AppPackages/**/Dependencies/**/*.appx
          retention-days: 30
