name: Build HoloLens SamplePlayer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: player/SamplePlayer
        run: nuget restore SamplePlayer.sln

      - name: Fix Holographic Remoting include path
        run: |
          $base = "player\SamplePlayer\packages\Microsoft.Holographic.Remoting.2.9.3\build\native\include"
          $src  = "$base\10.0.22621.0"
          $dst  = "$base\10.0.26100.0"
          if (Test-Path $src) {
            Write-Host "Copiando includes de 10.0.22621.0 para 10.0.26100.0..."
            Copy-Item -Path $src -Destination $dst -Recurse -Force
            Write-Host "Concluído."
          } else {
            Write-Host "ERRO: pasta de origem não encontrada: $src"
            Get-ChildItem $base
            exit 1
          }
        shell: pwsh

      - name: Build ARM64 Release
        working-directory: player/SamplePlayer
        run: |
          msbuild SamplePlayer.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=ARM64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:WindowsTargetPlatformVersion=10.0.26100.0
        shell: pwsh

      - name: List AppPackages content
        run: |
          Get-ChildItem -Recurse player/SamplePlayer/AppPackages | Select-Object FullName
        shell: pwsh

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: SamplePlayer-ARM64-Release
          path: player/SamplePlayer/AppPackages/**
          retention-days: 30
