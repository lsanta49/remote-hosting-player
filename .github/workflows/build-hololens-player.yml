name: Build HoloLens SamplePlayer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Diagnóstico — mostra SDKs disponíveis no runner
      - name: List installed Windows SDKs
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkPath) {
            Write-Host "=== SDKs disponíveis ==="
            Get-ChildItem $sdkPath | Select-Object Name
          } else {
            Write-Host "Nenhum SDK encontrado"
          }
        shell: pwsh

      - name: Restore NuGet packages
        working-directory: player
        run: nuget restore SamplePlayer.sln

      - name: Build ARM64 Release
        working-directory: player
        run: |
          msbuild SamplePlayer.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=ARM64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:WindowsTargetPlatformVersion=10.0.20348.0
        # ↑ Sobrescreve o SDK exigido pelo .vcxproj

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: SamplePlayer-ARM64-Release
          path: |
            player/AppPackages/**/*.msixbundle
            player/AppPackages/**/Dependencies/**/*.appx
          retention-days: 30
