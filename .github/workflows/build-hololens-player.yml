name: Build HoloLens SamplePlayer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ADICIONADO: Instala o Windows SDK 10.0.22621.0 que o projeto exige
      - name: Install Windows SDK 10.0.22621.0
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Baixando Windows SDK 10.0.22621.0..."
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/?linkid=2196241" `
            -OutFile "$env:TEMP\winsdksetup.exe"
          Write-Host "Instalando..."
          Start-Process -Wait "$env:TEMP\winsdksetup.exe" `
            -ArgumentList "/features OptionId.UWPManaged OptionId.UWPUnmanaged /q /norestart"
          Write-Host "SDK instalado com sucesso."
        shell: pwsh

      - name: Restore NuGet packages
        working-directory: player
        run: nuget restore SamplePlayer.sln

      - name: Build ARM64 Release
        working-directory: player
        run: |
          msbuild SamplePlayer.sln `
            /p:Configuration=Release `
            /p:Platform=ARM64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=ARM64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: SamplePlayer-ARM64-Release
          path: |
            player/AppPackages/**/*.msixbundle
            player/AppPackages/**/Dependencies/**/*.appx
          retention-days: 30
